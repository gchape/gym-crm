server:
  port: 8081
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
  datasource:
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{transactionId:-}] "
  include-application-name: false
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    consul:
      host: localhost
      port: 8500
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
gym-crm:
  auth:
    issuer: http://localhost:8081
    access-token-ttl: PT30M
    key-store:
      location: classpath:keystore/dev-keystore.p12
      password: ${KEYSTORE_PASSWORD:dev-keystore-pass}
      alias: gym-crm-auth
      key-password: ${KEYSTORE_KEY_PASSWORD:dev-keystore-pass}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    consul:
      host: ${CONSUL_HOST:gym-crm-consul}
      port: ${CONSUL_PORT:8500}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
gym-crm:
  auth:
    issuer: ${GYM_CRM_ISSUER_URI}
    access-token-ttl: ${GYM_CRM_ACCESS_TOKEN_TTL:PT30M}
    key-store:
      location: file:${KEYSTORE_PATH}
      password: ${KEYSTORE_PASSWORD}
      alias: ${KEYSTORE_ALIAS}
      key-password: ${KEYSTORE_KEY_PASSWORD}