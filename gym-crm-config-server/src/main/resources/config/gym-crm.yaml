server:
  port: 8081
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
resilience4j:
  circuitbreaker:
    instances:
      workloadService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
  datasource:
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        registration:
          gym-crm-service:
            client-id: gym-crm-service
            client-secret: ${GYM_CRM_CLIENT_SECRET:dev-secret-change-me}
            authorization-grant-type: client_credentials
            scope: workload.write
        provider:
          gym-crm-service:
            token-uri: http://localhost:9000/oauth2/token
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 10
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
      client:
        registration:
          gym-crm-service:
            client-id: gym-crm-service
            client-secret: ${GYM_CRM_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: workload.write
        provider:
          gym-crm-service:
            token-uri: ${OAUTH2_ISSUER_URI}/oauth2/token
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://gym-crm-eureka-server:8761/eureka/}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}