server:
  port: 8082
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
---
spring:
  config:
    activate:
      on-profile: dev
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 10
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://gym-crm-workload-server:8761/eureka/}