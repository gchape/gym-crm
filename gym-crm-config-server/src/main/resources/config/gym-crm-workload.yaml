server:
  port: 8082
springdoc:
  swagger-ui:
    path: /swagger-ui.html
spring:
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}:${random.value}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gym-crm-workload
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: tech.provokedynamic.gymcrmcommon.event
        spring.json.value.default.type: tech.provokedynamic.gymcrmcommon.event.WorkloadEvent
        spring.json.use.type.headers: false
  data:
    mongodb:
      auto-index-creation: true
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{transactionId:-}] "
  include-application-name: false
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    consul:
      host: localhost
      port: 8500
  data:
    mongodb:
      uri: mongodb://localhost:27017/gym_crm_workload
---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
  cloud:
    consul:
      host: ${CONSUL_HOST:gym-crm-consul}
      port: ${CONSUL_PORT:8500}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    mongodb:
      uri: ${MONGO_URI}