services:
  consul:
    image: hashicorp/consul:2.0
    container_name: gym-crm-consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"   # HTTP API / UI
      - "8600:8600/udp"  # DNS
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
