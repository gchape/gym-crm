server:
  port: 8081

spring:
  config:
    import: ""
  cloud:
    consul:
      enabled: false
    discovery:
      enabled: false

  datasource:
    url: jdbc:h2:mem:gymcrm;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{transactionId:-}] "
  include-application-name: false

app:
  workload:
    events-enabled: false
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200

gym-crm:
  auth:
    issuer: http://localhost:8081
    access-token-ttl: PT30M
    key-store:
      location: classpath:keystore/dev-keystore.p12
      password: ${KEYSTORE_PASSWORD:dev-keystore-pass}
      alias: gym-crm-auth
      key-password: ${KEYSTORE_KEY_PASSWORD:dev-keystore-pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info
